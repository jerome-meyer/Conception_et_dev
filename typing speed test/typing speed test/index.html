<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Test de rapidité de frappe</h1>

        <div id="gestion_difficulte_cadre">
            <button class="bouton_difficulte" data-difficulte="facile">Facile</button>
            <button class="bouton_difficulte actif" data-difficulte="moyen">Moyen</button>
            <button class="bouton_difficulte" data-difficulte="difficile">Difficile</button>
        </div>

        <div id="texte-a-taper"></div>

        <div id="cadre_test_principal">
            <textarea id="textarea" placeholder="Commencez à écrire ici pour démarrer le test..."></textarea>
        </div>

        <div id="stats">
            <p>Temps restant : <span id="chrono">60</span>s</p>
            <p>MPM en direct : <span id="wpm-live">0</span></p>
        </div>

        <div id="ecran-resultats" style="display: none;">
            <h2>Résultats de la partie</h2>
            
            <div class="resultats-grille">
                <div class="stat-card">
                    <span id="score-wpm" class="stat-valeur">0</span>
                    <span class="stat-label">MPM</span>
                </div>
                <div class="stat-card">
                    <span id="score-precision" class="stat-valeur">0</span>
                    <span class="stat-label">Précision %</span>
                </div>
                <div class="stat-card">
                    <span id="temps-ecoule" class="stat-valeur">0</span>
                    <span class="stat-label">Temps (s)</span>
                </div>
            </div>

            <div id="historique-container">
                <h3 class="historique-titre">Historique des parties</h3>
                <p>Meilleur score : <span id="meilleur-score">0</span> MPM</p>
                <p>Moyenne générale : <span id="moyenne-score">0</span> MPM</p>
                <ul id="liste-historique">
                    </ul>
            </div>

            <button id="btn-recommencer">Recommencer une partie</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
